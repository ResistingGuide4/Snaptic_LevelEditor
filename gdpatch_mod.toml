id = "snaptic_leveleditor"

[meta]
name = "SNAPTIC Level Editor"
version = "0.1.0"
authors = ["InfoBroad"]
description = "Adds a level editor to the SNAPTIC Demo. You can access it by opening the dev console (ctrl+alt+d, f1) and typing 'level level_editor'"

